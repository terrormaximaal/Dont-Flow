name: CI

#  Runs on every branch, not just main: work here lands on feature branches
#  without always going through a pull request, and those need checking too.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      #  build-nolog rather than build: the logged variant pings an external
      #  service on every run, which a CI job has no business doing.
      - name: Build
        run: npm run build-nolog
